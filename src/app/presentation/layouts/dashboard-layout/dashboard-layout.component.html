<main class="relative flex flex-col md:flex-row h-screen w-screen overflow-hidden bg-[#0a0a12]">
  <!-- Elementos decorativos de fondo -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <!-- Gradientes de fondo y formas -->
    <div class="absolute top-[-30%] left-[-10%] w-[70%] h-[60%] bg-indigo-900/10 rounded-full blur-[120px]"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[50%] bg-blue-900/10 rounded-full blur-[100px]"></div>
    <div class="absolute top-[20%] right-[10%] w-[40%] aspect-square bg-purple-900/10 rounded-full blur-[80px]"></div>
    
    <!-- Líneas decorativas -->
    <div class="hidden lg:block absolute top-[15%] left-[20%] w-[25%] h-[1px] bg-gradient-to-r from-transparent via-blue-500/40 to-transparent"></div>
    <div class="hidden lg:block absolute top-[75%] right-[15%] w-[30%] h-[1px] bg-gradient-to-r from-transparent via-indigo-500/40 to-transparent"></div>
    <div class="hidden lg:block absolute bottom-[25%] left-[30%] w-[1px] h-[20%] bg-gradient-to-b from-transparent via-blue-500/30 to-transparent"></div>
  </div>

  <!-- Panel lateral con transformación 3D sutil -->
  <aside 
    [ngClass]="{'translate-x-0': sidebarVisible, '-translate-x-full md:translate-x-0': !sidebarVisible}"
    class="absolute md:relative z-30 md:z-10 flex flex-col w-[85%] sm:w-[320px] h-screen bg-[#12121e]/80 backdrop-blur-xl transform transition-all duration-300 border-r border-white/5 shadow-[5px_0_25px_rgba(0,0,0,0.3)]">
    
    <!-- Barra superior con logo y control de menú -->
    <div class="flex items-center justify-between p-4 h-16 border-b border-white/5">
      <div class="flex items-center space-x-3">
        <div class="relative flex items-center justify-center">
          <!-- Logo con efecto de resplandor -->
          <div class="absolute inset-0 bg-blue-500/20 rounded-lg blur-md"></div>
          <div class="relative z-10 w-9 h-9 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-lg flex items-center justify-center shadow-lg">
            <i class="fa-solid fa-calendar-check text-white text-lg"></i>
          </div>
        </div>
        <h1 class="font-bold text-lg">
          <span class="text-blue-400">Eventos</span>
        </h1>
      </div>
      
      <button 
        (click)="toggleSidebar()"
        class="md:hidden p-2 rounded-full hover:bg-white/5 text-blue-300 transition-colors">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    
    <!-- Contenido del sidebar con scroll personalizado -->
    <div class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-6">
      <!-- Perfil del usuario -->
      <div class="group relative p-3 overflow-hidden rounded-xl bg-gradient-to-br from-[#1e1e2d] to-[#1a1a25] border border-white/5 shadow-inner shadow-black/20">
        <div class="absolute inset-0 bg-gradient-to-r from-blue-600/0 via-blue-600/5 to-purple-600/0 opacity-0 group-hover:opacity-100 transition-opacity duration-700"></div>
        
        <div class="flex items-center space-x-3 relative z-10">
          <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500/20 to-indigo-500/20 flex items-center justify-center ring-2 ring-white/10">
            <i class="fa-regular fa-user text-blue-300 text-sm"></i>
          </div>
          <div>
            <div class="text-sm font-medium text-white">Bienvenido</div>
            <div class="text-xs text-blue-300/80">Administrador</div>
          </div>
        </div>
      </div>
      
      <!-- Navegación principal con estilo único -->
      <div class="space-y-1">
        <div class="pl-2 pb-1 text-xs font-medium text-white/40 uppercase tracking-wider">NAVEGACIÓN</div>
        
        @for (route of routes; track route.path) {
          <app-sidebar-menu-item
            [description]="route.data!['description']"
            [icon]="route.data!['icon']"
            [path]="route.path!"
            [title]="route.data!['title']"
          />
        }
      </div>
      
      <!-- Lista de chats con separador estilizado -->
      @if (threads().length > 0) {
        <div class="relative">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-white/5"></div>
          </div>
          <div class="relative flex justify-center">
            <span class="px-2 bg-[#12121e] text-xs font-medium text-blue-300">CONVERSACIONES</span>
          </div>
        </div>
        
        <!-- Diseño de tarjetas de chat completamente renovado -->
        <div class="grid gap-2">
          @for(chat of threads(); track chat.id) {
            <button
              (click)="loadChat(chat)"
              class="group relative flex items-center w-full p-2.5 rounded-lg overflow-hidden transition-all duration-300 hover:shadow-md"
              [ngClass]="chat.id === currentChatId ? 
                'bg-gradient-to-r from-blue-900/30 to-indigo-900/20 ring-1 ring-blue-500/30 shadow-[0_0_15px_rgba(59,130,246,0.1)]' : 
                'hover:bg-white/5'"
            >
              <!-- Indicador visual de chat activo -->
              <div class="absolute left-0 top-0 bottom-0 w-1 bg-gradient-to-b from-blue-500 to-indigo-500 rounded-r transform origin-left scale-y-0 transition-transform"
                   [ngClass]="chat.id === currentChatId ? 'scale-y-100' : 'group-hover:scale-y-75'"></div>
              
              <!-- Contenido del botón de chat -->
              <div class="flex items-center space-x-3 pl-2">
                <!-- Icono con animación de pulso sutil para el chat activo -->
                <div class="flex-shrink-0 w-8 h-8 rounded-lg flex items-center justify-center transition-all duration-300"
                     [ngClass]="chat.id === currentChatId ? 
                       'bg-gradient-to-br from-blue-600 to-indigo-600 shadow-[0_0_8px_rgba(59,130,246,0.5)]' : 
                       'bg-gradient-to-br from-blue-900/30 to-indigo-900/30'">
                  <i class="fa-solid fa-comment-dots text-blue-300" 
                     [ngClass]="chat.id === currentChatId ? 'text-white' : 'text-blue-400'"></i>
                </div>
                
                <!-- Nombre del chat con truncamiento -->
                <span class="flex-1 text-sm truncate" 
                      [ngClass]="chat.id === currentChatId ? 'text-white font-medium' : 'text-gray-300'">
                  {{ chat.name }}
                </span>
                
                <!-- Botón de eliminar con animación de aparición -->
                <button 
                  *ngIf="chat.id === currentChatId || true"
                  class="opacity-0 group-hover:opacity-100 transition-opacity p-1.5 hover:bg-white/10 rounded-full text-gray-400 hover:text-red-400"
                  (click)="$event.stopPropagation(); deleteChat(chat.id)">
                  <i class="fa-solid fa-times text-xs"></i>
                </button>
              </div>
            </button>
          }
        </div>
      }
    </div>
    
    <!-- Panel inferior con acciones principales -->
    <div class="border-t border-white/5 p-3 bg-[#10101a]">
      <div class="flex space-x-2">
        <!-- Botón de limpiar con estilo neomórfico -->
        <button
          (click)="cleanLocalStorage()"
          class="flex-1 group relative p-2.5 rounded-lg bg-gradient-to-br from-[#1a1a28] to-[#15151f] hover:from-[#1c1c2c] hover:to-[#17172a] border border-white/5 shadow-md overflow-hidden transition-all duration-300"
        >
          <!-- Efecto de resplandor en hover -->
          <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-blue-600/0 to-blue-600/10 opacity-0 group-hover:opacity-100 transition-all duration-500"></div>
          
          <div class="relative flex items-center justify-center space-x-2 text-sm">
            <i class="fa-solid fa-broom text-blue-400 group-hover:text-blue-300 transition-colors"></i>
            <span class="text-white/70 group-hover:text-white transition-colors">Limpiar</span>
          </div>
        </button>
        
        <!-- Botón de nuevo chat estilo llamativo -->
        <button
          (click)="newChat()"
          class="flex-1 group relative p-2.5 rounded-lg bg-gradient-to-br from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 border border-white/10 shadow-md overflow-hidden transition-all duration-300"
        >
          <div class="absolute top-0 left-0 right-0 h-px bg-white/20"></div>
          <div class="absolute -bottom-0 -right-0 w-16 h-16 bg-white/10 rounded-full blur-xl"></div>
          
          <div class="relative flex items-center justify-center space-x-2 text-sm">
            <i class="fa-solid fa-plus text-white"></i>
            <span class="text-white">Nuevo Chat</span>
          </div>
        </button>
      </div>
      
      <!-- Enlace de ayuda -->
      <div class="mt-3 flex justify-center">
        <a href="#" class="inline-flex items-center space-x-1 text-xs text-blue-400/70 hover:text-blue-300 transition-colors">
          <i class="fa-regular fa-circle-question"></i>
          <span>Centro de Ayuda</span>
        </a>
      </div>
    </div>
  </aside>

  <!-- Overlay para cerrar el menú en móvil -->
  <div 
    *ngIf="sidebarVisible" 
    (click)="toggleSidebar()"
    class="fixed inset-0 bg-black/60 backdrop-blur-sm z-20 md:hidden transition-opacity duration-300">
  </div>

  <!-- Área de contenido principal con diseño único -->
  <div class="flex-1 flex flex-col h-screen">
    <!-- Barra superior con controles -->
    <header class="h-16 px-4 flex items-center justify-between border-b border-white/5 bg-[#0c0c16]/80 backdrop-blur-lg z-10">
      <!-- Menú para móvil y título -->
      <div class="flex items-center space-x-3">
        <button 
          (click)="toggleSidebar()"
          class="md:hidden p-2 rounded-full hover:bg-white/5 text-blue-400">
          <i class="fa-solid fa-bars"></i>
        </button>
        
        <h2 class="text-lg font-medium bg-clip-text text-transparent bg-gradient-to-r from-white to-blue-100">
          <i class="fa-solid fa-chart-pie text-blue-400 mr-2 hidden sm:inline-block"></i>
          <span>Presupuestos para Eventos</span>
        </h2>
      </div>
      
      <!-- Controles y acciones -->
      <div class="flex items-center space-x-2">
        <button
          class="relative flex items-center space-x-2 px-3 py-2 rounded-lg bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white transition-all duration-300 shadow-md shadow-blue-900/20 overflow-hidden group"
          [class.opacity-75]="isGeneratingPdf"
          [disabled]="isGeneratingPdf"
          (click)="convertLastAssistantMessage()"
        >
          <!-- Efecto de luces -->
          <div class="absolute -top-2 -right-2 w-12 h-12 bg-white/20 rounded-full blur-lg opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
          
          <!-- Contenido del botón -->
          <span class="hidden sm:inline relative z-10">Descargar PDF</span>
          
          <!-- Spinner o icono -->
          <span class="relative z-10" *ngIf="isGeneratingPdf">
            <i class="fa-solid fa-circle-notch animate-spin"></i>
          </span>
          <i *ngIf="!isGeneratingPdf" class="fa-solid fa-download relative z-10"></i>
        </button>
      </div>
    </header>
    
    <!-- Área de contenido con efecto de cristal y bordes luminosos -->
    <div class="relative flex-1 overflow-hidden p-3 sm:p-5">
      <!-- Marco decorativo con resplandor -->
      <div class="absolute inset-0 rounded-xl border border-blue-500/10 pointer-events-none"></div>
      <div class="absolute top-0 right-0 left-0 h-px bg-gradient-to-r from-transparent via-blue-500/20 to-transparent"></div>
      <div class="absolute bottom-0 right-0 left-0 h-px bg-gradient-to-r from-transparent via-indigo-500/20 to-transparent"></div>
      
      <!-- Contenido real de la aplicación -->
      <div class="relative h-full overflow-hidden rounded-xl bg-[#090912]/80 backdrop-blur-sm border border-white/5 shadow-xl">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</main>
