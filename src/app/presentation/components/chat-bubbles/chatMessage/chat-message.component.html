<div class="col-start-1 col-end-9 p-3 rounded-lg">
  <div class="flex flex-row items-start">
    <div class="flex items-center justify-center h-10 w-10 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex-shrink-0 shadow-lg shadow-purple-500/20">
      <i class="fa-solid fa-robot text-white"></i>
    </div>

    <div class="relative ml-3 text-sm bg-gradient-to-r from-slate-700/90 to-slate-800/90 py-3 px-4 shadow-lg shadow-slate-900/30 rounded-2xl max-w-[85%]">
      <markdown class="prose prose-invert max-w-none prose-p:mt-0 prose-p:mb-2 prose-headings:mb-2 prose-headings:mt-3 prose-code:bg-gray-800 prose-code:p-0.5 prose-code:rounded">{{ text }}</markdown>

      @if (audioUrl) {
        <audio
          controls
          [src]="audioUrl"
          autoplay
          class="w-full mt-2 rounded-lg"
        ></audio>
      }

      @if (imageInfo) {
        <div class="mt-3 relative group">
          <img
            [src]="imageInfo.url"
            [alt]="imageInfo.alt"
            class="rounded-lg w-full max-h-96 object-cover shadow-md transition-transform duration-300 hover:scale-[1.01]"
          />
          <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity rounded-lg flex items-end justify-center">
            <a [href]="imageInfo.url" target="_blank" class="mb-2 px-3 py-1 bg-black/50 text-white text-xs rounded-full backdrop-blur-sm hover:bg-black/70 transition-colors">Ver imagen</a>
          </div>
        </div>
      }

      <div class="absolute -bottom-2 -left-1 text-[10px] text-slate-400 font-light">
        {{ getCurrentTime() }}
      </div>
    </div>
  </div>
</div>
